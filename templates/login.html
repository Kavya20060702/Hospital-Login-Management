<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="hospital-icon">
                🏥
            </div>

            <h1>Hospital Management</h1>

            <p class="subtitle">
                Secure Staff Login
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <div class="input-group">
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <div class="remember">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="demo">

                <h4>Demo Accounts</h4>

                <p>
                    <b>Admin:</b> admin / admin123
                </p>

                <p>
                    <b>Doctor:</b> doctor / doctor123
                </p>

                <p>
                    <b>Nurse:</b> nurse / nurse123
                </p>

            </div>

            <p class="footer">
                © 2026 Hospital Management System
            </p>

        </div>

    </div>

</body>

</html>
